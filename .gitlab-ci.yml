---
image: docker:20.10.4

services: ['docker:20.10.4-dind']

#
# Pipeline cache is based on CI_COMMIT_REF_SLUG.
#
cache:
  key: ${CI_COMMIT_REF_SLUG}

#
# Docker variables for allowing image build.
#
variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  GIT_SUBMODULE_STRATEGY: recursive
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

#
# Workflow defining rules for running the pipeline.
#
workflow:
  rules: [{'if': '$CI_COMMIT_MESSAGE =~ /-wip/', 'when': 'never'}, {'when': 'always'}]


#
# Static script to be reused by the enabled stages.
#

.apk-before-script: &apk-before-script
  # Install required apk packages.
  - apk add --update bash wget ca-certificates openssl git tar openssh-client curl python3 py3-pip

.apt-before-script: &apt-before-script
  - apt -y update
  - apt -y install wget ca-certificates openssl git tar openssh-client

# Script for docker based stages.
.docker-script: &docker-script
  - docker login registry.u-hopper.com -u $REGISTRY_USERNAME -p $REGISTRY_PASSWORD

# Scripts for installing Ansible and the associated roles directly from the Lab.
.ansible-script: &ansible-script
  # Install and run ssh-agent if not already installed, it is required by Docker.
  # (change apt-get to yum if you use an RPM-based image)
  - 'which ssh-agent || apk add openssh-client'
  - eval $(ssh-agent -s)

  # Add the SSH key stored in SSH_PRIVATE_KEY variable to the agent store
  # We're using tr to fix line endings which makes ed25519 keys work
  # without extra base64 encoding.
  # https://gitlab.com/gitlab-examples/ssh-private-key/issues/1#note_48526556

  # Configure .ssh folder
  - mkdir -p ~/.ssh
  - ssh-keyscan -p 4422 lab.u-hopper.com >> gitlabKey
  - ssh-keygen -lf gitlabKey
  - cat gitlabKey  >> ~/.ssh/known_hosts
  - chmod 700 ~/.ssh

  - pip install ansible ansible-lint

# Scripts for allowing the build of php/yii2 projects
# that require composer for installing dependencies.
.php-script: &php-script
  - apk add --update php7 php7-phar php7-json php7-iconv php7-openssl
  - curl --show-error --silent https://getcomposer.org/installer | php

# Script for allowing the connection to a remote server for completing a deployment.
.remote-server-connection: &remote-server-connection
  # Configure .ssh folder
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh

  # The USER_DEPLOY_SSH_KEY contains the private key granting access to the deployment server
  - echo "$USER_DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
  - chmod 400  ~/.ssh/id_rsa
  - export ANSIBLE_HOST_KEY_CHECKING=False


#
# Stages to run.
#

stages:
  - build
  - test
  - push
  - deploy


#
# Stages for default.
#


badges:default:
  stage: build
  image: public.registry.u-hopper.com/python:3.12
  script:
    - pip install PyYAML anybadge
    - python docker-support/badges.py
  needs: []
  allow_failure: true
  artifacts:
    paths:
      - template.svg
      - deploy.svg
    expire_in: 1 day
  only:
    - main


#
# Stages for mr.
#


unit:mr:
  stage: test
  image: public.registry.u-hopper.com/python:3.12
  script:
    - python -v
    - mkdir -p ~/.config/pip
    - echo "$PIP_CONF_DOCKER" > ~/.config/pip/pip.conf
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - cp -r test src/
    - cp docker-support/run_tests.sh src/
    - cd src
    - ./run_tests.sh
  needs: []
  only:
    - merge_requests


coverage:mr:
  stage: test
  coverage: '/^TOTAL.+?(\d+\%)$/'
  image: public.registry.u-hopper.com/python:3.12
  allow_failure: true
  script:
    - python -v
    - mkdir -p ~/.config/pip
    - echo "$PIP_CONF_DOCKER" > ~/.config/pip/pip.conf
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install coverage pytest-cov
    - cp -r test src/
    - cp docker-support/run_test_coverage.sh src/
    - cp docker-support/.coveragerc src/
    - cd src
    - PYTHONPATH=. ./run_test_coverage.sh test .
  artifacts:
    when: always
    reports:
      junit: src/report.xml
      coverage_report:
        coverage_format: cobertura
        path: src/coverage.xml
  needs: []
  only:
    - merge_requests


lint:mr:
  stage: test
  image: public.registry.u-hopper.com/python:3.12
  allow_failure: False
  script:
    - python -v
    - mkdir -p ~/.config/pip
    - echo "$PIP_CONF_DOCKER" > ~/.config/pip/pip.conf
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install flake8
    - flake8 --ignore E501,W504,E241,F405,F403 src
  cache:
    paths:
      - .cache/pip
      - venv/
  needs: []
  only:
    - merge_requests


#
# Stages for production.
#


docker image:production:
  stage: build
  script:
    - *apk-before-script
    - *docker-script

    - ./docker-support/runner.sh -bs $CI_COMMIT_TAG
  artifacts:
    paths:
      - docker_image.tar.gz
    expire_in: 1 day
  needs: []
  only:
    - tags


badges:production:
  stage: build
  image: public.registry.u-hopper.com/python:3.12
  script:
    - pip install PyYAML anybadge
    - python docker-support/badges.py
  needs: []
  allow_failure: true
  artifacts:
    paths:
      - template.svg
      - deploy.svg
    expire_in: 1 day
  only:
    - tags


unit:production:
  stage: test
  image: public.registry.u-hopper.com/python:3.12
  script:
    - python -v
    - mkdir -p ~/.config/pip
    - echo "$PIP_CONF_DOCKER" > ~/.config/pip/pip.conf
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - cp -r test src/
    - cp docker-support/run_tests.sh src/
    - cd src
    - ./run_tests.sh
  needs: []
  only:
    - tags


coverage:production:
  stage: test
  coverage: '/^TOTAL.+?(\d+\%)$/'
  image: public.registry.u-hopper.com/python:3.12
  allow_failure: true
  script:
    - python -v
    - mkdir -p ~/.config/pip
    - echo "$PIP_CONF_DOCKER" > ~/.config/pip/pip.conf
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install coverage pytest-cov
    - cp -r test src/
    - cp docker-support/run_test_coverage.sh src/
    - cp docker-support/.coveragerc src/
    - cd src
    - PYTHONPATH=. ./run_test_coverage.sh test .
  artifacts:
    when: always
    reports:
      junit: src/report.xml
      coverage_report:
        coverage_format: cobertura
        path: src/coverage.xml
  needs: []
  only:
    - tags


push:production:
  stage: push
  script:
    - *apk-before-script
    - *docker-script
    - docker load -i docker_image.tar.gz
    - ./docker-support/runner.sh -p $CI_COMMIT_TAG
  dependencies:
    - docker image:production
  needs: 
    - docker image:production
    - unit:production
  only:
    - tags


deploy:production:
  stage: deploy
  image: public.registry.u-hopper.com/python:3.11
  allow_failure: false
  needs: 
    - push:production
  script:
    - *apt-before-script
    - *ansible-script
    - *remote-server-connection

    # The ANSIBLE_ROLE_PRIVATE_KEY variable contains a private key granting access
    # to our private ansible roles on GitLab. This key is used to clone the roles
    # during the pipeline execution.
    - echo "$ANSIBLE_ROLE_PRIVATE_KEY" | tr -d '\r' | ssh-add -

    - cd deployment
    - ansible-galaxy install -r requirements.yml -f
    - echo $ANSIBLE_VAULT_PASSWORD > password_file

    - ansible-playbook -i inventory/production/hosts --vault-password-file password_file playbook.yml
  environment:
    name: production
    url: https://demo.agribee.u-hopper.com
  only:
    - tags
  when: manual


